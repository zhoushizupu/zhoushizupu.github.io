<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>数据转换工具</title>
</head>
<body>
  <h1>家族数据转换工具</h1>
  <p>正在转换数据...</p>
  <pre id="output"></pre>
  
  <script>
    async function convertData() {
      const output = document.getElementById('output');
      
      try {
        // 加载现有数据
        const response = await fetch('/public/data/family.json');
        const data = await response.json();
        
        const persons = data.family.persons;
        const convertedPersons = {};
        
        // 转换每个人
        Object.keys(persons).forEach(id => {
          const person = persons[id];
          
          // 提取现有数据
          let birthPlace = person.birthPlace || '';
          if (!birthPlace || birthPlace === '') {
            birthPlace = '广西钦州市灵山县那隆镇长福石岭垌村';
          }
          
          // 使用 biography 或 achievements 作为简介
          let biography = person.biography || '';
          if (!biography && person.achievements && person.achievements.length > 0) {
            biography = person.achievements.join('。');
          }
          
          // 转换为新格式
          convertedPersons[id] = {
            id: person.id || id,
            generationCode: person.generationCode || '1001',
            name: person.name || '',
            gender: person.gender || 'M',
            birthDate: person.birthDate || '',
            deathDate: person.deathDate || '',
            birthPlace: birthPlace,
            residence: person.residence || '',
            generationWord: person.generationWord || '',
            biography: biography,
            family: {
              parents: person.family?.parents || [],
              spouses: person.family?.spouses || [],
              children: person.family?.children || []
            }
          };
        });
        
        // 更新数据
        data.family.persons = convertedPersons;
        
        // 输出结果
        const result = `转换完成！
转换人数：${Object.keys(convertedPersons).length}
        
JSON 数据已生成，请点击下方按钮复制：`;
        
        output.textContent = result;
        
        // 创建复制按钮
        const copyBtn = document.createElement('button');
        copyBtn.textContent = '📋 复制 JSON 数据';
        copyBtn.style.cssText = 'padding: 10px 20px; font-size: 16px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px 0;';
        copyBtn.onclick = () => {
          const jsonStr = JSON.stringify(data, null, 2);
          navigator.clipboard.writeText(jsonStr).then(() => {
            alert('✅ 已复制到剪贴板！\n\n请打开 /public/data/family.json，全选 (Ctrl+A)，粘贴 (Ctrl+V)，然后保存 (Ctrl+S)');
          }).catch(err => {
            alert('复制失败：' + err);
          });
        };
        
        document.body.appendChild(copyBtn);
        
        // 显示统计
        const stats = document.createElement('div');
        stats.style.cssText = 'margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px;';
        stats.innerHTML = `
          <h3>字段说明：</h3>
          <ul>
            <li>✅ name - 姓名</li>
            <li>✅ gender - 性别（M/F）</li>
            <li>✅ birthDate - 出生日期（农历）</li>
            <li>✅ deathDate - 逝世日期（留空表示在世）</li>
            <li>✅ birthPlace - 出生地（默认：广西钦州市灵山县那隆镇长福石岭垌村）</li>
            <li>✅ residence - 现居地</li>
            <li>✅ generationWord - 字辈</li>
            <li>✅ biography - 简介/生平</li>
            <li>✅ family.parents - 父母 ID 列表</li>
            <li>✅ family.spouses - 配偶 ID 列表</li>
            <li>✅ family.children - 子女 ID 列表</li>
          </ul>
        `;
        document.body.appendChild(stats);
        
      } catch (error) {
        output.textContent = '转换失败：' + error.message;
      }
    }
    
    // 页面加载时执行
    convertData();
  </script>
</body>
</html>
